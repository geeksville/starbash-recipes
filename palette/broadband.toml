[repo]
kind = "recipe"

[recipe]
description = "Pass a broadband (non-narrowband) stack through unchanged so the common star-removal and stretch pipeline applies."

[[stages]]

name = "palette_broadband"
description = "Broadband palette: load the denoised broadband stack and save it as broadband.fits"
tool.name = "siril"
#role = "palette" 

# Broadband data has no Ha/OIII/SII channels to combine. We just load the
# noise-reduced stack and re-save it under a canonical name so the downstream
# common stages (starnet -> veralux -> merge_stars -> thumbnail) have a palette
# output to consume.
script = '''
    load "{input[0].full_paths[0]}"
    save "{output.full_paths[0]}"
    '''

[[stages.inputs]]
kind = "job"
after = "denoise" # the role name: whichever denoiser will actually run
multiplex = true # suffix the task with _i0 so veralux's "(starnet|palette_broadband).*" prefix-matches instead of exact-matching only palette_broadband

[[stages.inputs.requires]]
kind = "metadata"
name = "filter"
value = ["HaOiii", "SiiOiii"]
invert = true

# A narrowband target with an added broadband night also produces
# crop_stacked_bb.fits. That file is a star plate, not this palette's input;
# the metadata gate above only rejects it while the inherited filter happens to
# be narrowband. Say so directly.
[[stages.inputs.requires]]
kind = "filename"
value = "stacked_bb"
mode = "exclude"

[[stages.inputs.requires]]
kind = "min_count"
value = 1

[[stages.outputs]]
kind = "processed"
name = ["broadband.fits"]
