[repo]
kind = "recipe"

[recipe]
description = "Generate an 'SHO' (golden/blue Hubble palette) from HaOiii (and optionally SiiOiii) data. Green is the real Sii channel when present, otherwise a synthetic Ha/OIII blend."

[[stages]]

name = "palette_sho"
description = "SHO palette: R=Ha, G=Sii-or-synthetic, B=OIII"
tool.name = "siril"
#role = "palette"

# Channels are selected out of the prior stage outputs by filename suffix
# (_Ha / _OIII / _Sii). We load them by absolute path and re-save under canonical
# names so Siril PixelMath ($Ha$ / $OIII$) can reference them.
#
# The green line is a single template expression: if a _Sii channel is present it
# expands to `load <sii>` (real Sii on green), otherwise to a `pm` blend of Ha+OIII.
script = '''
    # Bring the noise-reduced Ha/OIII channels in under canonical names and
    # normalize each to its own signal scale.  A plain -rescale 0..1 divides by
    # the global max, which a duo-stack OIII channel pins at ~3 (a star), so its
    # nebulosity enters rgbcomp ~8x fainter than Ha's and no colour control can
    # lift it (doc/plans/duo-palette-orange.md).  Instead we subtract each
    # channel's median (sky -> 0) and divide the above-sky signal by the
    # channel's own P99 (read from the input file at expansion time), so all
    # three channels contribute on a comparable, star-free footing; the P99
    # maps to `signal_reference` (a small linear value, not 1.0) so the nebula
    # keeps headroom for the display stretch and the top-1% does not blow out;
    # bright stars still clip at 1 and stay white.
    load {[str(p) for p in input["ha"].full_paths if "_Ha" in str(p)][0]}
    save SHO_Ha
    pm "min(max($SHO_Ha$ - median($SHO_Ha$), 0) * {signal_scale([str(p) for p in input['ha'].full_paths if '_Ha' in str(p)][0])} * {parameters.signal_reference}, 1)"
    save SHO_Ha
    load {[str(p) for p in input["oiii"].full_paths if "_OIII" in str(p)][0]}
    save SHO_OIII
    pm "min(max($SHO_OIII$ - median($SHO_OIII$), 0) * {signal_scale([str(p) for p in input['oiii'].full_paths if '_OIII' in str(p)][0])} * {parameters.signal_reference}, 1)"
    save SHO_OIII

    # Green channel: use the real Sii channel if present, otherwise synthesize
    # one from the (already normalized) Ha+OIII channels.
    {'load ' + [str(p) for p in input["sii"].full_paths if "_Sii" in str(p)][0] if [str(p) for p in input["sii"].full_paths if "_Sii" in str(p)] else 'pm "$SHO_Ha$ * ' + str(parameters.ha_weight) + ' + $SHO_OIII$ * ' + str(parameters.oiii_weight) + '"'}
    save SHO_SynGreen
    # The real-Sii branch gets the same anchored normalization as Ha/OIII above;
    # the synthetic blend is already on their scale and must not be re-scaled.
    {'pm "min(max($SHO_SynGreen$ - median($SHO_SynGreen$), 0) * ' + str(signal_scale([str(p) for p in input['sii'].full_paths if '_Sii' in str(p)][0])) + ' * ' + str(parameters.signal_reference) + ', 1)"' if [str(p) for p in input['sii'].full_paths if '_Sii' in str(p)] else ''}
    save SHO_SynGreen
    # Boost the above-sky signal of each non-red channel.  The normalization
    # above made the sky exactly 0, which is also the anchor here - not Siril's
    # median(), whose histogram median jumps up onto the signal once roughly
    # half the pixels are clipped to 0.  At strength 1 this is the identity;
    # the clipped sky stays at 0 and stars stay at 1.
    pm "$SHO_SynGreen$ + ({parameters.green_strength} - 1) * $SHO_SynGreen$ * (1 - $SHO_SynGreen$) / (1 + ({parameters.green_strength} - 1) * $SHO_SynGreen$)"
    save SHO_SynGreen

    # Boost blue only after synthesizing green: a target without real Sii uses
    # the UNBOOSTED OIII in its green blend, so the controls remain independent.
    pm "$SHO_OIII$ + ({parameters.blue_strength} - 1) * $SHO_OIII$ * (1 - $SHO_OIII$) / (1 + ({parameters.blue_strength} - 1) * $SHO_OIII$)"
    save SHO_OIII

    # For real Sii, the stronger of the boosted green/blue signals controls
    # red suppression (not their sum, which would double-count overlap).
    # Synthetic green contains Ha, so use ONLY blue on single-duo targets:
    # otherwise an Ha-only nebula would suppress its own red channel.
    pm "max($SHO_OIII$, {'$SHO_SynGreen$' if [str(p) for p in input['sii'].full_paths if '_Sii' in str(p)] else '0'})"
    save SHO_Companion
    # Suppress Ha in proportion to how strongly real Sii and/or OIII dominate
    # it: A*C/(A+C) is Ha's above-sky signal A scaled by the companion dominance
    # ratio C/(A+C), so the red cast is silenced where the boosted companion
    # wins (and grows with the companion's strength).  (1 - min(R, G, B))
    # protects white star cores only - the old (1 - Ha) also shielded bright
    # red nebula that the companion should have tamed.
    pm "$SHO_Ha$ - {parameters.red_suppression} * $SHO_Ha$ * $SHO_Companion$ / ($SHO_Ha$ + $SHO_Companion$ + 0.000001) * (1 - min($SHO_Ha$, min($SHO_SynGreen$, $SHO_OIII$)))"
    save SHO_Ha

    # Merge into an SHO image: R=Ha, G=SynGreen (Sii or synthetic), B=OIII
    rgbcomp SHO_Ha SHO_SynGreen SHO_OIII -out=SHO_results

    # Keep the synthetic green selected by ha_weight / oiii_weight. Inverted
    # rmgreen used to floor it at (R+B)/2 and alter red/blue as well.

    # Move to the final output location
    load SHO_results
    save "{output.full_paths[0]}"
    '''

[[stages.inputs]]
kind = "job"
name = "ha"
# The Ha channel is required.  Keep this requirement on its own input block so
# min_count applies to this channel rather than to each multiplexed upstream
# task (which contains only one channel).
after = "denoise" # the role name: whichever denoiser will actually run

[[stages.inputs.requires]]
kind = "metadata"
name = "filter"
value = ["HaOiii", "SiiOiii"]

[[stages.inputs.requires]]
kind = "filename"
value = "_Ha"

[[stages.inputs.requires]]
kind = "min_count"
value = 1

[[stages.inputs]]
kind = "job"
name = "oiii"
# OIII is also required, but has its own min_count requirement.
after = "denoise" # the role name: whichever denoiser will actually run

[[stages.inputs.requires]]
kind = "metadata"
name = "filter"
value = ["HaOiii", "SiiOiii"]

[[stages.inputs.requires]]
kind = "filename"
value = "_OIII"

[[stages.inputs.requires]]
kind = "min_count"
value = 1

[[stages.inputs]]
kind = "job"
name = "sii"
# Sii is optional: without a _Sii output the script synthesizes green instead.
# A dual-duo stack combines HaOiii and SiiOiii sessions. Its downstream
# multiplexed tasks inherit HaOiii metadata even for the _Sii output, so do not
# gate this channel on an upstream session's FILTER; select its actual filename.
after = "denoise" # the role name: whichever denoiser will actually run
optional = true

[[stages.inputs.requires]]
kind = "filename"
value = "_Sii"

[[stages.outputs]]
kind = "processed"
name = ["SHO.fits"]

[[stages.parameters]]
name = "ha_weight"
default = 0.4                                                              # Value used if not overriden
description = "Ha contribution when synthesizing the green channel (0..1)"

[[stages.parameters]]
name = "oiii_weight"
default = 0.6                                                                # Value used if not overriden
description = "OIII contribution when synthesizing the green channel (0..1)"

[[stages.parameters]]
name = "green_strength"
default = 2
description = "Boost Sii (or synthetic green) signal above its sky median; 1 = unchanged, try 1.5 for Ha-dominant targets (>=1)"

[[stages.parameters]]
name = "blue_strength"
default = 2.0
description = "Boost OIII (blue) signal above its sky median; 1 = unchanged, try 2.0 for Ha-dominant targets (>=1)"

[[stages.parameters]]
name = "red_suppression"
default = 0.3
description = "Suppress Ha in proportion to how strongly boosted OIII (or real Sii) exceeds Ha's own above-sky signal; synthetic green is ignored. 0 = unchanged, 1 = strongest (0..1)"

[[stages.parameters]]
name = "signal_reference"
default = 0.1
description = "Linear value each channel's P99 maps to; lower = gentler (less noise amplification and top-1% blowout), higher = brighter. Leave headroom for the display stretch (0.02..0.5)"
