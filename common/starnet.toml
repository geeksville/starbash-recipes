[repo]
kind = "recipe"

[recipe]
description = "Remove stars from an image with StarNet (via Siril), producing a starless image and a star mask."

[[stages]]
name = "starnet"
description = "Star removal with StarNet via Siril"
tool.name = "starnet"

# Siril's 'starnet' command writes starless_<stem> and starmask_<stem> into the
# working directory (process_dir), using the user's configured FITS extension
# (.fit or .fits). We load each result by basename and re-save it to the declared
# output paths.  The load names carry NO extension: Siril resolves the spelling
# itself, using the same configured extension it just used to write the files,
# so the re-load always finds them (a filesystem probe like
# resolve_fits_variant() cannot work here - at script-expansion time the starnet
# command has not run yet, so neither spelling exists on disk and the probe is
# a no-op that leaves a hardcoded '.fit' behind, which then fails on machines
# whose preference is '.fits').
script = '''
    load "{input[0].full_paths[0]}"
    starnet {parameters.params}
    load "{str(process_dir)}/starless_{input[0].full_paths[0].stem}"
    save "{output.full_paths[0]}"
    load "{str(process_dir)}/starmask_{input[0].full_paths[0].stem}"
    save "{output.full_paths[1]}"
    '''

[[stages.inputs]]
kind = "job"
after = "palette.*" # run on the palette output
multiplex = true

[[stages.inputs.requires]]
kind = "min_count"
value = 1

# Two outputs (starless + starmask) are declared as a single output block with a
# name list; entries are context-expanded so names stay unique per input file.
[[stages.outputs]]
kind = "processed"
name = [
    "starless_{input[0].full_paths[0].stem}.fits",
    "starmask_{input[0].full_paths[0].stem}.fits",
]

[[stages.parameters]]
name = "params"
default = "-stretch"
description = "Options passed to the Siril 'starnet' command (e.g. -stretch, -upscale, -stride=value)"
