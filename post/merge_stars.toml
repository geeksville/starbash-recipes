[repo]
kind = "recipe"

[recipe]
description = "Blend a controllable fraction of the removed stars back into the VeraLux-stretched starless image."

[[stages]]
name = "merge_stars"
description = "Screen-blend the removed stars back into the stretched starless image"
tool.name = "siril"

# Base = hms_starless_<palette>.fits (VeraLux, already stretched).
# Star layer = its sibling starmask_<palette>.fits (starnet, linear/unstretched),
# autostretched into the same tonal range, then screen-blended back over the
# starless image.
#
# When a cropped broadband plate resolved, the mask is a stencil rather than the
# star layer.  In both cases the stars' *colour* must come from neutral data, not
# from the palette mask: the mask carries the narrowband SHO hue (blue after the
# boosts) and its R/G/B ratios would leak into the stars (the broadband branch
# used to multiply the plate by the coloured mask).  So we first flatten the mask
# to its per-pixel luminance, and both branches use that neutral stencil: the
# broadband plate's stars keep the plate's (single-layer) brightness, the fallback
# uses the mask luminance directly.  Separately, the starless still carries
# residual star light (starnet is not perfect) tinted by the palette; we knock it
# out under the mask before blending so the stars you see come from the neutral
# star layer.  The plate is the denoised one when that stage ran, otherwise the
# cropped stack.
script = '''
    load "{input[0].full_paths[0]}"
    save starless

    load "{str(input[0].full_paths[0].parent / (input[0].full_paths[0].stem.replace('hms_starless_', 'starmask_') + '.fits'))}"
    save starmask
    pm "min($starless$ * (1 - {parameters.star_residual_removal} * min($starmask$ / (max($starmask$) + 1.0e-9), 1)), 1)"
    save starless
    # Neutral stencil: the mask's per-pixel luminance (split -> average -> RGB).
    load starmask
    split r g b
    load r
    save rchan
    load g
    save gchan
    load b
    save bchan
    load rchan
    pm "($rchan$ + $gchan$ + $bchan$) / 3"
    save luma
    rgbcomp luma luma luma -out=starmask_flat
    {siril_line(input["broadband"], 'load "%s"', input["broadband"].full_paths[0] if input["broadband"].full_paths else "")}
    {siril_line(input["broadband"], "save broadband", "")}
    {siril_line(input["broadband"], "rgbcomp broadband broadband broadband -out=broadband_rgb", "")}
    {siril_line(input["broadband"], 'pm "$broadband_rgb$ * $starmask_flat$"', "")}
    {siril_line(input["broadband"], "save starmask", "")}
    {siril_line(input["broadband"], "load starmask", "")}
    {'load starmask_flat' if not input['broadband'].full_paths else ''}
    asinh -human {parameters.stretch}
    save stars

    pm "1 - (1 - $starless$) * (1 - $stars$)"
    save results

    load results
    save "{output.full_paths[0]}"
    '''

[[stages.inputs]]
kind = "job"
after = "veralux.*"
multiplex = true # one task per upstream file, so multi-file stacks (e.g. SHO/HOO) each get merged

[[stages.inputs.requires]]
kind = "min_count"
value = 1

# Belt-and-suspenders: only operate on starless files (VeraLux already skips starmask).
[[stages.inputs.requires]]
kind = "filename"
value = "hms_starless"
mode = "include"

# The cropped broadband plate, after background/deblur/denoise when those ran.
# The denoise role wins when it produced the plate; crop is the fallback when
# it did not. Not multiplexed: every palette blends the same one star plate.
[[stages.inputs]]
kind = "job"
name = "broadband"
after = "(denoise|crop)"
optional = true

[[stages.inputs.requires]]
kind = "filename"
value = "stacked_bb\\.fits$"

[[stages.outputs]]
kind = "processed"
# merged_<palette>.fits, derived from hms_starless_<palette>.fits
name = ["{input[0].full_paths[0].stem.replace('hms_starless_', 'merged_')}.fits"]

[[stages.parameters]]
name = "stretch"
default = 1000.0
description = "asinh stretch factor applied to the linear starmask before blending (higher = more stars visible)"

[[stages.parameters]]
name = "star_residual_removal"
default = 0.85
description = "How much residual star light is knocked out of the starless under the star mask before blending (0 = keep it, 1 = fully remove). The residuals carry the palette's narrowband star tint; removing them lets the neutral star layer show"

